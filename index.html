<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Lakou Ati — Pwodwi Espirityèl Sakre / Sacred Haitian Spiritual Goods — Blessed by the Ati National">
<title>Lakou Ati — Pwodwi Espirityèl Sakre</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --noir: #0D0807; --noir-mid: #1A1208; --noir-light: #2C1E0E;
    --or: #D4A843; --or-light: #F0C866; --or-pale: #2A2010;
    --cream: #FDF8F0; --cream-dim: rgba(253,248,240,0.65); --cream-faint: rgba(253,248,240,0.2);
    --or-border: rgba(212,168,67,0.2); --or-glow: rgba(212,168,67,0.12);
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Jost', sans-serif; background: var(--noir); color: var(--cream); min-height: 100vh; overflow-x: hidden; }

  /* TOP BAR */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 110; height: 34px; background: #0A0604; display: flex; align-items: center; justify-content: space-between; padding: 0 3rem; border-bottom: 1px solid var(--or-border); }
  .topbar-tagline { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(212,168,67,0.45); }
  .topbar-back { font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(212,168,67,0.5); text-decoration: none; transition: color 0.2s; display: flex; align-items: center; gap: 0.4rem; }
  .topbar-back:hover { color: var(--or); }
  .lang-toggle { display: flex; align-items: center; background: rgba(212,168,67,0.07); border-radius: 2rem; border: 1px solid var(--or-border); overflow: hidden; }
  .lang-btn { padding: 0.25rem 0.8rem; cursor: pointer; border: none; background: none; color: rgba(253,248,240,0.4); font-family: 'Jost', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.2s, color 0.2s; }
  .lang-btn.active { background: var(--or); color: var(--noir); border-radius: 2rem; }

  /* HEADER */
  header { position: fixed; top: 34px; left: 0; right: 0; z-index: 100; height: 110px; background: var(--noir-mid); border-bottom: 2px solid var(--or); display: grid; grid-template-columns: 160px 1fr 260px; }
  .header-logo-slot { display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .header-logo-img { height: 78px; object-fit: contain; filter: brightness(0) invert(1); }
  .header-brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem 2rem; }
  .header-site-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 700; line-height: 1; color: var(--cream); letter-spacing: 0.04em; }
  .header-site-name span { color: var(--or); font-style: italic; }
  .header-nav-links { display: flex; gap: 2rem; list-style: none; }
  .header-nav-links a { text-decoration: none; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream-dim); transition: color 0.2s; }
  .header-nav-links a:hover { color: var(--or); }
  .header-actions { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.85rem; padding: 1rem 2rem; }
  .cart-btn { background: var(--or); color: var(--noir); border: none; border-radius: 2rem; padding: 0.6rem 1.5rem; font-family: 'Jost', sans-serif; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.15s; display: flex; align-items: center; gap: 0.5rem; }
  .cart-btn:hover { background: var(--or-light); transform: translateY(-1px); }
  .cart-count { background: var(--noir); color: var(--or); border-radius: 50%; width: 18px; height: 18px; font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .header-spacer { height: 144px; }

  /* STRIP */
  .strip { background: var(--or); padding: 0.5rem 0; overflow: hidden; white-space: nowrap; }
  .strip-inner { display: inline-block; animation: marquee 28s linear infinite; }
  .strip-inner span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--noir); padding: 0 2rem; }

  /* HERO */
  .hero { display: grid; grid-template-columns: 1fr 1fr; min-height: 85vh; }
  .hero-left { display: flex; flex-direction: column; justify-content: center; padding: 5rem; background: radial-gradient(ellipse at 30% 50%, rgba(212,168,67,0.06) 0%, transparent 70%); }
  .hero-kicker { font-size: 0.65rem; letter-spacing: 0.45em; text-transform: uppercase; color: var(--or); margin-bottom: 1.5rem; }
  .hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 6vw, 5.5rem); font-weight: 700; line-height: 0.95; color: var(--cream); margin-bottom: 1.5rem; }
  .hero-title em { font-style: italic; color: var(--or); display: block; }
  .hero-desc { font-size: 0.95rem; font-weight: 300; color: var(--cream-dim); line-height: 1.85; margin-bottom: 2.5rem; max-width: 420px; }
  .hero-cta { display: inline-flex; align-items: center; gap: 0.75rem; background: var(--or); color: var(--noir); border: none; border-radius: 2rem; padding: 0.85rem 2rem; font-family: 'Jost', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.15s; }
  .hero-cta:hover { background: var(--or-light); transform: translateY(-2px); }
  .hero-right { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
  .product-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; transition: background 0.25s; border: 1px solid rgba(212,168,67,0.08); }
  .product-tile:hover { background: rgba(212,168,67,0.06); }
  .tile-symbol { font-size: 2.5rem; color: var(--or); opacity: 0.6; }
  .tile-name { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; font-weight: 700; color: var(--cream); text-align: center; }
  .tile-sub { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(212,168,67,0.55); text-align: center; }

  /* PRODUCTS */
  section { padding: 5rem; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 3rem; border-bottom: 1px solid var(--or-border); padding-bottom: 1.5rem; }
  .section-head h2 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 700; color: var(--cream); line-height: 1; }
  .section-head h2 .accent { color: var(--or); font-style: italic; }
  .section-kicker { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(212,168,67,0.55); font-weight: 500; }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
  .product-card { background: var(--noir-mid); border: 1px solid var(--or-border); overflow: hidden; transition: transform 0.25s, box-shadow 0.25s, border-color 0.3s; }
  .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(212,168,67,0.1); border-color: rgba(212,168,67,0.4); }
  .product-img { height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; background: #12100B; position: relative; }
  .product-img-symbol { font-size: 2.5rem; color: var(--or); opacity: 0.4; }
  .product-img-brand { height: 140px; object-fit: contain; opacity: 1; }
  .product-badge { position: absolute; top: 0.75rem; right: 0.75rem; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; padding: 0.25rem 0.6rem; }
  .badge-new { background: var(--or); color: var(--noir); }
  .badge-hot { background: #C0392B; color: #fff; }
  .badge-bs { background: rgba(212,168,67,0.2); color: var(--or); border: 1px solid var(--or-border); }
  .product-body { padding: 1.25rem; }
  .product-brand-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .product-brand-tag { font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--or); opacity: 0.6; font-weight: 600; }
  .product-name { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 700; color: var(--cream); margin-bottom: 0.3rem; line-height: 1.1; }
  .product-sub { font-size: 0.78rem; font-weight: 300; color: var(--cream-dim); margin-bottom: 0.6rem; font-style: italic; }
  .product-desc { font-size: 0.8rem; color: rgba(253,248,240,0.55); line-height: 1.65; margin-bottom: 0.75rem; }
  .product-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--or-border); padding-top: 1rem; }
  .product-price { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; color: var(--or); }
  .product-price small { font-size: 0.8rem; color: var(--cream-dim); font-weight: 300; font-family: 'Jost', sans-serif; }
  .add-btn { background: var(--or); color: var(--noir); border: none; border-radius: 2rem; padding: 0.5rem 1.2rem; font-family: 'Jost', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.18s, transform 0.15s; }
  .add-btn:hover { background: var(--or-light); transform: scale(1.04); }
  .add-btn.added { background: #2A5C3A; color: #fff; }

  /* FEATURES */
  .features { background: #0A0604; padding: 4rem 5rem; border-top: 1px solid var(--or-border); border-bottom: 1px solid var(--or-border); }
  .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; max-width: 1200px; margin: 0 auto; }
  .feature-item { text-align: center; }
  .feature-icon { font-size: 2rem; margin-bottom: 0.75rem; display: block; }
  .feature-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 700; color: var(--or-light); margin-bottom: 0.3rem; }
  .feature-desc { font-size: 0.8rem; font-weight: 300; color: var(--cream-faint); line-height: 1.65; }

  /* STORY */
  .story { display: grid; grid-template-columns: 1fr 1fr; padding: 0; background: var(--noir-mid); }
  .story-img { background: radial-gradient(ellipse at center, #3D2A08, #1A1208 60%, #0D0807); min-height: 480px; display: flex; align-items: center; justify-content: center; font-size: 7rem; position: relative; overflow: hidden; border-right: 1px solid var(--or-border); }
  .story-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 60%, var(--noir-mid)); }
  .story-text { padding: 5rem 4rem; display: flex; flex-direction: column; justify-content: center; }
  .story-text .section-kicker { margin-bottom: 1rem; display: block; }
  .story-text h2 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 3vw, 2.8rem); font-weight: 700; color: var(--cream); line-height: 1.15; margin-bottom: 1.5rem; }
  .story-text h2 em { font-style: italic; color: var(--or); }
  .story-text p { font-size: 0.92rem; font-weight: 300; color: var(--cream-dim); line-height: 1.85; margin-bottom: 1rem; max-width: 440px; }

  /* ATI SECTION */
  .ati-section { background: var(--noir-light); display: grid; grid-template-columns: 400px 1fr; min-height: 520px; overflow: hidden; border-top: 1px solid var(--or-border); }
  .ati-visual { background: radial-gradient(ellipse at 30% 60%, #3D2A08, #1A1208 60%, #0D0807); display: flex; align-items: flex-end; justify-content: center; position: relative; overflow: hidden; padding-top: 3rem; }
  .ati-visual::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23D4A843' fill-opacity='0.04'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E"); }
  .ati-avatar-wrap { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .ati-avatar-img { width: 240px; height: 240px; border-radius: 50%; border: 4px solid var(--or); object-fit: cover; box-shadow: 0 0 0 8px rgba(212,168,67,0.12), 0 0 0 16px rgba(212,168,67,0.05); }
  .ati-badge-seal { position: absolute; bottom: -10px; right: -10px; width: 76px; height: 76px; background: var(--or); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 3px solid var(--noir-light); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .seal-icon { font-size: 1.1rem; }
  .seal-text { font-size: 0.4rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--noir); line-height: 1.2; padding: 0 4px; }
  .ati-ribbon { background: var(--or); color: var(--noir); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.4rem 2.2rem; margin-top: 1.5rem; position: relative; z-index: 2; clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0% 50%); }
  .ati-content { padding: 4rem 4.5rem; display: flex; flex-direction: column; justify-content: center; }
  .ati-kicker { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--or-light); font-weight: 500; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.6rem; }
  .ati-kicker::before { content: ''; display: inline-block; width: 28px; height: 1px; background: var(--or); }
  .ati-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem, 4vw, 3.5rem); font-weight: 700; color: var(--cream); line-height: 0.95; margin-bottom: 0.5rem; }
  .ati-name em { font-style: italic; color: var(--or-light); }
  .ati-title-tag { display: inline-flex; align-items: center; background: rgba(212,168,67,0.1); border: 1px solid var(--or-border); border-radius: 2rem; padding: 0.35rem 1rem; font-size: 0.72rem; font-weight: 500; color: var(--or-light); letter-spacing: 0.06em; margin-bottom: 2rem; width: fit-content; }
  .ati-bio { font-size: 0.92rem; font-weight: 300; color: var(--cream-dim); line-height: 1.85; margin-bottom: 1rem; max-width: 500px; }
  .ati-quote { border-left: 3px solid var(--or); padding-left: 1.25rem; margin: 1.75rem 0; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--cream); line-height: 1.5; max-width: 440px; }
  .ati-stats { display: flex; gap: 2.5rem; margin-top: 0.5rem; }
  .ati-stat-num { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--or-light); display: block; line-height: 1; margin-bottom: 0.2rem; }
  .ati-stat-label { font-size: 0.68rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-faint); }

  /* TESTIMONIALS */
  .testimonials { background: var(--noir); }
  .testimonial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
  .testimonial-card { background: var(--noir-mid); border: 1px solid var(--or-border); padding: 1.75rem; position: relative; transition: border-color 0.3s; }
  .testimonial-card:hover { border-color: rgba(212,168,67,0.4); }
  .testimonial-card::before { content: '\201C'; font-family: 'Cormorant Garamond', serif; font-size: 5rem; color: rgba(212,168,67,0.1); position: absolute; top: 0.5rem; left: 1rem; line-height: 1; }
  .testimonial-text { font-size: 0.88rem; color: var(--cream-dim); line-height: 1.75; margin-bottom: 1.25rem; padding-top: 2rem; font-style: italic; }
  .testimonial-author { display: flex; align-items: center; gap: 0.75rem; }
  .author-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; color: var(--noir); background: var(--or); flex-shrink: 0; }
  .author-name { font-size: 0.82rem; font-weight: 600; color: var(--cream); }
  .author-loc { font-size: 0.72rem; color: var(--cream-dim); }
  .stars { color: var(--or); font-size: 0.7rem; }

  /* FOOTER */
  footer { background: #0A0604; padding: 4rem 5rem 2rem; color: var(--cream-faint); border-top: 1px solid var(--or-border); }
  .footer-top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 3rem; margin-bottom: 3rem; }
  .footer-brand-name { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--or); display: block; margin-bottom: 1rem; }
  .footer-brand-name em { font-style: italic; }
  .footer-brand p { font-size: 0.82rem; font-weight: 300; line-height: 1.75; max-width: 280px; }
  .footer-col h4 { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--or-light); font-weight: 600; margin-bottom: 1.2rem; }
  .footer-col ul { list-style: none; }
  .footer-col ul li { font-size: 0.82rem; margin-bottom: 0.6rem; cursor: pointer; transition: color 0.2s; }
  .footer-col ul li:hover { color: var(--cream); }
  .footer-bottom { border-top: 1px solid var(--or-border); padding-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .footer-bottom p { font-size: 0.75rem; }

  /* CART */
  .cart-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(10,6,4,0.7); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .cart-overlay.open { opacity: 1; pointer-events: all; }
  .cart-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 201; width: 420px; background: var(--noir-mid); transform: translateX(100%); transition: transform 0.35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; border-left: 1px solid var(--or-border); }
  .cart-panel.open { transform: translateX(0); }
  .cart-header { padding: 1.5rem 1.75rem; border-bottom: 1px solid var(--or-border); display: flex; align-items: center; justify-content: space-between; }
  .cart-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; color: var(--or); }
  .close-cart { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--cream-dim); transition: color 0.2s; line-height: 1; }
  .close-cart:hover { color: var(--or); }
  .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.75rem; }
  .cart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1rem; color: var(--cream-dim); }
  .cart-empty span { font-size: 3rem; opacity: 0.4; }
  .cart-empty p { font-size: 0.9rem; font-weight: 300; font-style: italic; }
  .cart-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--or-border); }
  .cart-item-icon { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: var(--noir-light); flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 700; color: var(--cream); margin-bottom: 0.15rem; }
  .cart-item-qty { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
  .qty-btn { width: 22px; height: 22px; background: var(--noir-light); border: 1px solid var(--or-border); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--or); font-weight: 600; transition: background 0.15s; }
  .qty-btn:hover { background: var(--or-pale); }
  .qty-num { font-size: 0.85rem; font-weight: 500; min-width: 18px; text-align: center; color: var(--cream); }
  .cart-item-price { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 700; color: var(--or); flex-shrink: 0; }
  .remove-item { background: none; border: none; cursor: pointer; color: rgba(212,168,67,0.35); font-size: 1rem; transition: color 0.2s; padding: 0.25rem; }
  .remove-item:hover { color: #C0392B; }
  .cart-footer { padding: 1.25rem 1.75rem; border-top: 1px solid var(--or-border); background: var(--noir); }
  .cart-sub-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .cart-sub-row span { font-size: 0.8rem; color: var(--cream-dim); }
  .cart-total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--or-border); }
  .cart-total-row strong { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 700; color: var(--cream); }
  .total-price { font-family: 'Cormorant Garamond', serif; font-size: 1.75rem; font-weight: 700; color: var(--or); }
  .checkout-btn { width: 100%; background: var(--or); color: var(--noir); border: none; padding: 1rem; font-family: 'Jost', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
  .checkout-btn:hover { background: var(--or-light); }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #2A5C3A; color: #fff; padding: 0.75rem 1.5rem; border-radius: 2rem; font-size: 0.82rem; font-weight: 500; z-index: 300; transition: transform 0.3s cubic-bezier(.4,0,.2,1); white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

let cart = [], lang = 'ht';

function t(k) { return (T[lang]||T.ht)[k] || k; }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === (l==='ht'?'KR':'EN')));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n, v = t(k);
    if (k === 'story.title') el.innerHTML = v; else el.textContent = v;
  });
  renderProducts(); renderStrip(); updateCartUI();
}

function renderStrip() {
  const items = t('strip'); const s = items.map(i=>`<span>${i}</span>`).join('');
  document.getElementById('strip-inner').innerHTML = s+s;
}

function renderProducts() {
  const g = document.getElementById('product-grid');
  g.innerHTML = PRODUCTS.map(p => {
    const badgeMap = {'new':'badge-new','hot':'badge-hot','bs':'badge-bs'};
    const badgeLabel = p.badge ? `<div class="product-badge ${badgeMap[p.badge]||''}">${t('badge.'+p.badge)}</div>` : '';
    const brandTag = p.brand === 'bitasyon'
      ? `<div class="product-brand-row"><img src="images/bitasyon.png" style="height:44px;object-fit:contain;opacity:1;border-radius:3px;"><span class="product-brand-tag">Bitasyon</span></div>`
      : `<div class="product-brand-row"><img src="images/lakou-ati-logo.png" style="height:24px;object-fit:contain;opacity:0.7;filter:brightness(0) invert(1);"><span class="product-brand-tag">Lakou Ati</span></div>`;
    return `<div class="product-card">
      <div class="product-img">
        <span class="product-img-symbol">${p.symbol}</span>
        ${p.brand==='bitasyon'?'<img class="product-img-brand" src="images/bitasyon.png" alt="Bitasyon">':'<img class="product-img-brand" src="images/lakou-ati-logo.png" alt="Lakou Ati">'}
        ${badgeLabel}
      </div>
      <div class="product-body">
        ${brandTag}
        <div class="product-name">${p.name}</div>
        <div class="product-sub">${lang==='ht'?p.sub_ht:p.sub_en}</div>
        <div class="product-desc">${lang==='ht'?p.desc_ht:p.desc_en}</div>
        <div class="product-footer">
          <div class="product-price">$${p.price.toFixed(2)} <small>${t('p.unit')}</small></div>
          <button class="add-btn" id="btn-${p.id}" onclick="addToCart(${p.id})">${t('p.add')}</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const tiles = document.getElementById('product-tiles');
  if (tiles) tiles.innerHTML = PRODUCTS.map(p => `
    <div class="product-tile" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
      <span class="tile-symbol">${p.symbol}</span>
      <span class="tile-name">${p.name}</span>
      <span class="tile-sub">${lang==='ht'?p.sub_ht:p.sub_en}</span>
    </div>`).join('');
}

function addToCart(id) {
  const p = PRODUCTS.find(x=>x.id===id);
  const ex = cart.find(x=>x.id===id);
  if (ex) ex.qty++; else cart.push({...p, qty:1});
  updateCartUI();
  const btn = document.getElementById('btn-'+id);
  btn.textContent = t('p.added'); btn.classList.add('added');
  setTimeout(()=>{ btn.textContent=t('p.add'); btn.classList.remove('added'); }, 1500);
  showToast(p.name + ' ' + t('toast'));
}

function showToast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

function toggleCart() {
  document.getElementById('cart-overlay').classList.toggle('open');
  document.getElementById('cart-panel').classList.toggle('open');
}

function updateCartUI() {
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('cart-count').textContent = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cart-title-el').textContent = t('cart.title');
  document.getElementById('cart-empty-el').textContent = t('cart.empty');
  document.getElementById('cart-sub-label').textContent = t('cart.sub');
  document.getElementById('cart-ship-label').textContent = t('cart.ship');
  document.getElementById('cart-free-label').textContent = t('cart.free');
  document.getElementById('cart-total-label').textContent = t('cart.total');
  document.getElementById('cart-sub-val').textContent = '$'+total.toFixed(2);
  document.getElementById('cart-total-val').textContent = '$'+total.toFixed(2);
  document.getElementById('checkout-btn-el').textContent = t('cart.checkout');
  const list = document.getElementById('cart-items-list');
  const footer = document.getElementById('cart-footer');
  if (cart.length === 0) {
    list.innerHTML = `<div class="cart-empty"><span>✦</span><p>${t('cart.empty')}</p></div>`;
    footer.style.display = 'none';
  } else {
    footer.style.display = 'block';
    list.innerHTML = cart.map(i=>`
      <div class="cart-item">
        <div class="cart-item-icon">${i.symbol}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="changeQty(${i.id},-1)">−</button>
            <span class="qty-num">${i.qty}</span>
            <button class="qty-btn" onclick="changeQty(${i.id},1)">+</button>
          </div>
        </div>
        <span class="cart-item-price">$${(i.price*i.qty).toFixed(2)}</span>
        <button class="remove-item" onclick="removeFromCart(${i.id})">✕</button>
      </div>`).join('');
  }
}

function changeQty(id, d) {
  const i = cart.find(x=>x.id===id);
  if (!i) return;
  i.qty += d;
  if (i.qty <= 0) cart = cart.filter(x=>x.id!==id);
  updateCartUI();
}

function removeFromCart(id) { cart = cart.filter(x=>x.id!==id); updateCartUI(); }

function toggleMobileMenu() {
  document.getElementById('mobile-menu').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}

document.addEventListener('DOMContentLoaded', () => { setLang('ht'); });
</script>

</html>
