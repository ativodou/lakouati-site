<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kòmand Konfime — Lakou Ati</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', sans-serif; background: #0D0807; color: #FDF8F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { text-align: center; max-width: 500px; width: 100%; }
  .check { font-size: 3.5rem; margin-bottom: 1.5rem; display: block; }
  .brand { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 700; color: #D4A843; margin-bottom: 2rem; letter-spacing: 0.04em; }
  .brand em { font-style: italic; color: #F0C866; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; color: #FDF8F0; margin-bottom: 1rem; line-height: 1.1; }
  .divider { width: 50px; height: 2px; background: #D4A843; margin: 1.5rem auto; }
  p { font-size: 0.92rem; font-weight: 300; color: rgba(253,248,240,0.6); line-height: 1.85; margin-bottom: 1rem; max-width: 380px; margin-left: auto; margin-right: auto; }
  .quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: #D4A843; margin: 1.5rem auto; }
  .back-btn { display: inline-block; margin-top: 2rem; background: #D4A843; color: #0D0807; text-decoration: none; border-radius: 2rem; padding: 0.8rem 2.2rem; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; transition: background 0.2s; }
  .back-btn:hover { background: #F0C866; }
</style>
</head>
<body>
<div class="card">
  <span class="check">✦</span>
  <div class="brand">Lakou <em>Ati</em></div>
  <h1>Kòmand ou konfime!</h1>
  <div class="divider"></div>
  <p>Mèsi pou kòmand ou. Ou pral resevwa yon imel konfirmasyon nan kèk minit.</p>
  <p>Chak pwodwi beni pèsonèlman pa Ati Nasyonal Ayiti anvan ekspedisyon. Nou ap voye kolis ou a depi Miami.</p>
  <p class="quote">"Sakre a viv nan chak pwodwi." ✦</p>
  <a href="/" class="back-btn">← Tounen sou boutik la</a>
</div>
</body>
</html>
